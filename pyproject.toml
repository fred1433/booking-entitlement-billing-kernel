[project]
name = "booking-entitlement-billing-kernel"
version = "0.1.0"
description = "A small core for the hard part of a booking integration: duplicate deliveries, out of order updates, partner data that disagrees with itself, and a billing run that never charges twice."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:kernel.*"]
