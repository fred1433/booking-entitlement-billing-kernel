# Development only. These credentials are local, deliberately boring, and are
# not used anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kernel_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/kernel_dev
      CLAIM_TOKEN_SECRET: development-only-replace-outside-compose
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn kernel.api.app:create_app --factory --host 0.0.0.0 --port 8000"
